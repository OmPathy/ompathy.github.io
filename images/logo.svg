<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Main gradient background -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6c5ce7" />
      <stop offset="100%" stop-color="#a29bfe" />
    </linearGradient>
  </defs>
  
  <!-- Abstract wave shape -->
  <path d="M30,20 Q45,10 60,20 T90,30 Q80,45 90,60 T80,90 Q65,80 50,90 T20,80 Q30,65 20,50 T30,20" 
        fill="url(#logoGradient)" stroke="#4834d4" stroke-width="1" />
  
  <!-- Inner shape -->
  <path d="M40,30 Q50,25 60,30 T70,40 Q65,50 70,60 T60,70 Q50,65 40,70 T30,60 Q35,50 30,40 T40,30" 
        fill="#a29bfe" stroke="#4834d4" stroke-width="0.5" />
  
  <!-- Center dot -->
  <circle cx="50" cy="50" r="5" fill="#ffffff" />
</svg>